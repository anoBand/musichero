name: android

# Builds an installable test APK.
#   push to main     -> APK attached to the run (Actions tab > run > Artifacts)
#   push to release  -> tag v<package.json version> and a GitHub Release with the APK, downloadable from a phone
#                       (git push origin main:release; bump "version" in package.json first)
#   push a v* tag    -> GitHub Release with the APK for that tag
on:
  push:
    branches: [main, release]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Version name
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" = release ]; then v="v$(node -p "require('./package.json').version")"
          else v="dev-$GITHUB_RUN_NUMBER"; fi
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: Stop if this release already exists
        if: github.ref_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION_NAME" >/dev/null 2>&1; then
            echo "::error::$VERSION_NAME is already released. Raise \"version\" in package.json."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "musichero-${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: musichero-${{ env.VERSION_NAME }}
          path: musichero-*.apk
      - name: Publish release
        if: github.ref_type == 'tag' || github.ref_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION_NAME" musichero-*.apk --target "$GITHUB_SHA" --title "$VERSION_NAME" --generate-notes
