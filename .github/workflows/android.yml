name: android

# Builds an installable test APK.
#   push to main  -> APK attached to the run (Actions tab > run > Artifacts)
#   push a v* tag -> APK attached to a GitHub Release, downloadable straight from a phone
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "musichero-${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: musichero-${{ env.VERSION_NAME }}
          path: musichero-*.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" musichero-*.apk --title "$GITHUB_REF_NAME" --generate-notes
